<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT 大兵认证 - 卡密兑换系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f6f8fb 0%, #e9effd 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex items-center justify-center">
    <div class="max-w-4xl w-full">
        <!-- 头部标题 -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight mb-2">
                GPT 大兵认证
            </h1>
            <p class="text-lg text-gray-600">高效、稳定的 SheerID 验证兑换系统</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- 左侧表单区 -->
            <div class="lg:col-span-7 space-y-6">
                <div class="glass-card rounded-3xl p-6 lg:p-8">
                    <div class="space-y-6">
                        <!-- 卡密输入区 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">卡密激活码</label>
                            <div class="relative flex gap-2">
                                <div class="relative flex-1">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                                        </svg>
                                    </div>
                                    <input type="text" id="cardSecret" placeholder="请输入您的兑换卡密" 
                                        class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-all outline-none">
                                </div>
                                <button onclick="checkQuota()" 
                                    class="px-4 py-2 border border-indigo-600 text-indigo-600 font-semibold rounded-xl hover:bg-indigo-50 transition-colors text-sm whitespace-nowrap">
                                    查询余额
                                </button>
                                <button onclick="activateCard()" 
                                    class="px-4 py-2 bg-indigo-50 text-indigo-700 font-semibold rounded-xl hover:bg-indigo-100 transition-colors text-sm whitespace-nowrap border border-indigo-200">
                                    激活卡密
                                </button>
                            </div>
                            <div class="mt-3 flex items-center text-sm text-gray-500">
                                <span class="mr-2">当前余额:</span>
                                <span id="quotaDisplay" class="font-bold text-indigo-600 text-lg">0</span>
                                <span class="ml-1 text-xs text-gray-400">次</span>
                            </div>
                        </div>

                        <!-- 链接输入区 -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">SheerID 链接列表</label>
                            <div class="relative">
                                <textarea id="linksInput" rows="6" 
                                    placeholder="请输入 SheerID 验证链接，支持多个链接（每行一个）"
                                    class="block w-full p-4 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-all outline-none resize-none custom-scrollbar"></textarea>
                                <div class="absolute bottom-3 right-3 text-xs text-gray-400">支持批量处理</div>
                            </div>
                        </div>

                        <!-- 提交按钮 -->
                        <button onclick="startRedemption()" 
                            class="w-full btn-gradient text-white font-bold py-4 rounded-2xl text-lg shadow-lg">
                            立即开始兑换
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧结果区 -->
            <div class="lg:col-span-5 flex flex-col h-full">
                <div class="glass-card rounded-3xl p-6 flex-1 flex flex-col min-h-[400px]">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-bold text-gray-800">任务执行监控</h3>
                        <span id="taskCount" class="text-xs font-medium px-2 py-1 bg-gray-100 text-gray-500 rounded-md">暂无任务</span>
                    </div>
                    
                    <div id="resultsContainer" class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-2">
                        <div class="h-full flex flex-col items-center justify-center text-gray-400 opacity-60">
                            <svg class="w-16 h-16 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                            </svg>
                            <p class="text-sm">等待任务提交</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部说明 -->
        <div class="mt-8 text-center text-sm text-gray-400">
            &copy; 2025 GPT 大兵认证. 保留所有权利.
        </div>
    </div>

    <script>
        let pollingTasks = new Map();

        async function checkQuota() {
            const cardSecret = document.getElementById('cardSecret').value.trim();
            if (!cardSecret) {
                showToast('请输入卡密', 'error');
                return;
            }

            try {
                const response = await fetch(`http://120.26.192.203:8000/api/quota?card_secret=${cardSecret}`);
                const data = await response.json();
                if (data.success) {
                    document.getElementById('quotaDisplay').innerText = data.balance;
                } else {
                    showToast(data.error || '卡密无效', 'error');
                }
            } catch (error) {
                showToast('网络连接失败', 'error');
            }
        }

        async function activateCard() {
            const cardSecret = document.getElementById('cardSecret').value.trim();
            if (!cardSecret) {
                showToast('请输入卡密', 'error');
                return;
            }

            try {
                const response = await fetch('http://120.26.192.203:8000/api/activate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ card_secret: cardSecret })
                });
                const data = await response.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    checkQuota(); // 顺便刷新余额
                } else {
                    showToast(data.error || '激活失败', 'error');
                }
            } catch (error) {
                showToast('网络连接失败', 'error');
            }
        }

        async function startRedemption() {
            const cardSecret = document.getElementById('cardSecret').value.trim();
            const links = document.getElementById('linksInput').value.trim();

            if (!cardSecret || !links) {
                showToast('请填写完整卡密和链接', 'warning');
                return;
            }

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = `
                <div class="flex items-center justify-center p-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                </div>
            `;

            try {
                const response = await fetch('http://120.26.192.203:8000/api/redeem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ card_secret: cardSecret, links: links })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    resultsContainer.innerHTML = '';
                    document.getElementById('taskCount').innerText = `共 ${data.tasks.length} 个任务`;

                    data.tasks.forEach((task, index) => {
                        const taskEl = document.createElement('div');
                        const elId = `task-${task.task_id}`;
                        taskEl.id = elId;
                        taskEl.className = 'bg-white border border-gray-100 p-4 rounded-xl shadow-sm transition-all hover:shadow-md relative';
                        taskEl.innerHTML = `
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-sm font-bold text-gray-700">任务 #${index + 1}</span>
                                <span class="status-label px-2.5 py-1 rounded-full bg-blue-50 text-blue-600 text-[10px] font-bold uppercase tracking-wider">
                                    排队中 <span class="loading-dots"></span>
                                </span>
                            </div>
                            <div class="text-[11px] text-gray-400 font-mono truncate">ID: ${task.v_id}</div>
                            <div class="error-msg-row hidden text-[10px] text-red-500 mt-1 font-medium italic"></div>
                        `;
                        resultsContainer.appendChild(taskEl);
                        startPolling(task.task_id, elId);
                    });

                    if (data.errors && data.errors.length > 0) {
                        data.errors.forEach(err => {
                            const errEl = document.createElement('div');
                            errEl.className = 'bg-red-50 border border-red-100 p-3 rounded-xl text-xs text-red-600';
                            errEl.innerText = `提交失败: ${err.v_id.substring(0,10)}... (${err.error})`;
                            resultsContainer.appendChild(errEl);
                        });
                    }
                } else {
                    resultsContainer.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-xl text-sm font-medium">错误: ${data.detail || data.message || '系统异常'}</div>`;
                }
            } catch (error) {
                resultsContainer.innerHTML = '<div class="p-4 bg-red-50 text-red-600 rounded-xl text-sm font-medium">网络请求超时，请重试</div>';
            }
        }

        function startPolling(taskId, elementId) {
            if (pollingTasks.has(taskId)) return;
            
            const timer = setInterval(async () => {
                try {
                    const response = await fetch(`http://120.26.192.203:8000/api/status/${taskId}`);
                    const data = await response.json();
                    
                    if (data.success) {
                        const status = data.status;
                        const el = document.getElementById(elementId);
                        if (!el) { clearInterval(timer); return; }

                        const label = el.querySelector('.status-label');
                        
                        if (status === 'completed' || status === 'failed' || status === 'cancelled') {
                            const result = data.result || {};
                            if (status === 'completed' && result.success) {
                                label.className = 'status-label px-2.5 py-1 rounded-full bg-green-50 text-green-600 text-[10px] font-bold uppercase tracking-wider';
                                label.innerText = '验证成功';
                                el.classList.add('border-green-100', 'bg-green-50/30');
                                checkQuota();
                            } else {
                                // 处理任务失败或取消
                                let labelText = '验证失败';
                                let labelClass = 'bg-orange-50 text-orange-600';
                                let borderClass = 'border-orange-100';
                                
                                if (status === 'failed') {
                                    labelText = '任务失败';
                                    labelClass = 'bg-red-50 text-red-600';
                                    borderClass = 'border-red-100';
                                } else if (status === 'cancelled') {
                                    labelText = '已取消';
                                    labelClass = 'bg-gray-100 text-gray-600';
                                    borderClass = 'border-gray-200';
                                }

                                label.className = `status-label px-2.5 py-1 rounded-full ${labelClass} text-[10px] font-bold uppercase tracking-wider`;
                                label.innerText = labelText;
                                el.classList.add(borderClass);
                                
                                // 提取并显示错误信息
                                const errorMsg = (status === 'cancelled' ? data.message : null) || (result.data && result.data.systemErrorMessage) || result.error || result.message || '未知错误';
                                const errorRow = el.querySelector('.error-msg-row');
                                if (errorRow) {
                                    errorRow.innerText = `原因: ${errorMsg}`;
                                    errorRow.classList.remove('hidden');
                                }
                            }
                            clearInterval(timer);
                            pollingTasks.delete(taskId);
                        } else {
                            label.innerText = `处理中 ${status === 'processing' ? '⚙️' : ''}`;
                            const dots = document.createElement('span');
                            dots.className = 'loading-dots';
                            label.appendChild(dots);
                        }
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 5000);

            pollingTasks.set(taskId, timer);
        }

        function showToast(message, type = 'info') {
            alert(message);
        }
    </script>
</body>
</html>
